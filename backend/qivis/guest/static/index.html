<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk with Sun</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <aside id="sidebar">
    <div class="side-head">
      <span id="who"></span>
      <button id="close-side" class="icon" aria-label="Close list">✕</button>
    </div>
    <div class="new">
      <select id="model" aria-label="Model"></select>
      <button id="new-conv">New conversation</button>
    </div>
    <nav id="conversations" aria-label="Conversations"></nav>
  </aside>

  <main>
    <header>
      <button id="open-side" class="icon" aria-label="Conversations">☰</button>
      <h1 id="title">Sun</h1>
      <label class="toggle" title="Tint each word by how sure the model was">
        <input type="checkbox" id="heat" checked> certainty
      </label>
    </header>

    <p class="notice">
      Conversations here are recorded in Ian's research tool (Qivis) and may be studied.
      Please don't share anything you'd want kept private.
    </p>

    <section id="messages" aria-live="polite"></section>

    <form id="composer">
      <textarea id="input" rows="2" placeholder="Say something…" aria-label="Message"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </main>

  <div id="tip" role="tooltip" hidden></div>
</body>
</html>
